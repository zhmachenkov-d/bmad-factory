# Product-repo PR/push quality: Semgrep + diff-scoped mutmut + SARIF upload.
# Semgrep worsen vs baseline fails the job and posts one aggregated Slack.
# Diff mutmut: run + SARIF only (no survivor / full-score gate).
name: quality-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-groups

      - name: Resolve Semgrep baseline commit
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Semgrep (diff-aware) + baseline compare
        id: semgrep
        continue-on-error: true
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          EXTRA=()
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            EXTRA=(--baseline-commit="$BASE")
          fi
          set +e
          uv run python .ci/run_semgrep.py "${EXTRA[@]}" --compare-baseline
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci/out/semgrep.sarif
          category: semgrep

      - name: Diff-scoped mutmut + SARIF
        id: mutmut
        continue-on-error: true
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          EXTRA=()
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            EXTRA=(--base-ref="$BASE")
          fi
          set +e
          uv run python .ci/run_mutmut_diff.py "${EXTRA[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload mutmut (diff) SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci/out/mutmut-diff.sarif
          category: mutmut-diff

      - name: Build aggregated Slack payload (Semgrep worsen only on PR/push)
        id: slack
        if: always()
        run: |
          set +e
          uv run python .ci/slack_notify.py \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --worsen .ci/out/semgrep-worsen.json \
            --output .ci/out/slack-payload.json
          set -e
          if [ -f .ci/out/slack-payload.json ] && grep -q '"text"' .ci/out/slack-payload.json; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on worsen
        if: always() && steps.slack.outputs.should_notify == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: .ci/out/slack-payload.json

      - name: Fail job on Semgrep worsen or tool crash
        if: always()
        run: |
          SE="${{ steps.semgrep.outputs.exit_code }}"
          MU="${{ steps.mutmut.outputs.exit_code }}"
          echo "semgrep exit=$SE mutmut exit=$MU"
          # Semgrep: 0 clean, 2 worsen, other = tool crash
          # Mutmut diff: 0 ok (survivors allowed), non-zero = tool crash
          if [ "$SE" != "0" ] || [ "$MU" != "0" ]; then
            exit 1
          fi
