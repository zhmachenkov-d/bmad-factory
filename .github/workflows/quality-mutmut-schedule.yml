# Scheduled full mutmut vs baseline; score drop ≥ 1 fails + one aggregated Slack.
name: quality-mutmut-schedule

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  mutmut-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --all-groups

      - name: Full mutmut + baseline compare
        id: mutmut
        run: |
          set +e
          uv run python .ci/run_mutmut_full.py --compare-baseline
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload mutmut (full) SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci/out/mutmut-full.sarif
          category: mutmut-full

      - name: Build aggregated Slack payload
        id: slack
        if: always()
        run: |
          set +e
          uv run python .ci/slack_notify.py \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --worsen .ci/out/mutmut-worsen.json \
            --output .ci/out/slack-payload.json
          set -e
          if [ -f .ci/out/slack-payload.json ] && grep -q '"text"' .ci/out/slack-payload.json; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on worsen
        if: always() && steps.slack.outputs.should_notify == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: .ci/out/slack-payload.json

      - name: Fail job on mutmut worsen or tool crash
        if: always()
        run: |
          MU="${{ steps.mutmut.outputs.exit_code }}"
          echo "mutmut exit=$MU"
          if [ "$MU" != "0" ]; then
            exit 1
          fi
