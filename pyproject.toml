[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "bmad-factory"
version = "0.1.0"
description = "Deterministic CI orchestrator for BMAD ticket trees"
readme = "README.md"
requires-python = ">=3.14,<3.15"

[project.scripts]
bmad-factory = "bmad_factory.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bmad_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
