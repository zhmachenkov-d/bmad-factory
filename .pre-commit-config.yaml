# Local quality hooks: ruff + Semgrep + diff-scoped mutmut (no SARIF upload required).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src tests
        language: system
        pass_filenames: false
        types: [python]
      - id: semgrep
        name: semgrep (AST-diff / Python rules)
        entry: uv run python .ci/run_semgrep.py
        language: system
        pass_filenames: false
        types: [python]
      - id: mutmut-diff
        name: mutmut (diff-scoped)
        entry: uv run python .ci/run_mutmut_diff.py
        language: system
        pass_filenames: false
        types: [python]
